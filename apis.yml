aid: gigmile
name: Gigmile
description: Gigmile is an African mobility platform and gig-economy fintech that gives riders, drivers,
  and fleet operators a pathway to financial independence through affordable vehicle financing and
  operational support. It offers lease-to-own and flexible financing for motorcycles, tricycles, cars,
  and electric vehicles (via its Gamma Mobility asset-financing brand), alongside earned-wage access,
  vehicle insurance, health cover, maintenance, and working-capital/micro-credit for independent gig
  workers. Founded by Kay and Sam out of Africa's e-commerce sector, Gigmile operates across Nigeria
  and Ghana (Lagos, Accra) and helps mobility entrepreneurs onboard and scale managed fleets of riders.
